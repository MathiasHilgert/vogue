# golangci-lint configuration.
#
# The rules here are the ones this codebase already keeps by hand; they are
# written down so a reviewer does not have to. Generated files are excluded by
# the `generated: lax` default of golangci-lint, which recognises the
# `// Code generated ... DO NOT EDIT.` header the value-object generator emits.
version: "2"

linters:
  default: standard
  enable:
    - depguard # the domain layer must not reach for transport or persistence
    - errorlint # %w and errors.As over type assertions on errors
    - exhaustive # a switch over a Kind must name every kind
    - gocritic
    - misspell
    - revive
    - testifylint
    - tparallel # a parallel subtest inside a non-parallel parent never runs as intended

  settings:
    depguard:
      rules:
        vogue:
          # vogue generates domain types. A value object that imported an HTTP
          # package, a database driver or reflect would have stopped being one.
          files:
            - "**/pkg/vogue/**"
          deny:
            - pkg: net/http
              desc: value objects are transport-agnostic; map them to a payload at the boundary
            - pkg: reflect
              desc: vogue resolves every rule at generate time, which is the point of it
            - pkg: database/sql
              desc: generated code implements database/sql/driver, it does not talk to a database

    errorlint:
      errorf: true
      asserts: true
      comparison: true

    exhaustive:
      default-signifies-exhaustive: true

    gocritic:
      enabled-tags:
        - diagnostic
        - style
      disabled-checks:
        # A generator returns (source, ok) and (literal, ok) all over; naming
        # those results in the signature adds noise, not information.
        - unnamedResult

    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: indent-error-flow
        - name: var-naming
        - name: error-strings
        - name: error-return
        - name: errorf
        - name: context-as-argument
        - name: range-val-in-closure
        - name: unexported-return

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Tests may shadow, hard-code and repeat themselves; that is what makes
      # them readable as specifications.
      - path: _test\.go
        linters:
          - gocritic
      # The generator's templates are data, not prose.
      - path: pkg/vogue/gen/templates/
        linters:
          - misspell

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
